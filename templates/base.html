<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportal</title>
    <style>
        :root {
            --bg: #f3f7fb;
            --bg-accent: #dfeffc;
            --card: #ffffff;
            --text: #172133;
            --muted: #5e6b7e;
            --line: #dce5f2;
            --primary: #2c6fda;
            --primary-dark: #1f4fa8;
            --success: #1f9254;
            --danger: #c74646;
            --shadow: 0 12px 30px rgba(31, 60, 105, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: linear-gradient(180deg, #f9fcff 0%, var(--bg) 45%, var(--bg-accent) 100%);
            min-height: 100vh;
        }

        .page {
            max-width: 1120px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .hero {
            text-align: center;
            margin-bottom: 22px;
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 44px;
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-size: 16px;
        }

        .topbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 18px;
            font-size: 14px;
            color: var(--muted);
        }

        .topbar a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
            align-items: start;
        }

        .single-col {
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            box-shadow: var(--shadow);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 14px;
            font-size: 30px;
        }

        .subtitle {
            color: var(--muted);
            margin-top: -4px;
            margin-bottom: 18px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 14px; color: var(--muted); }

        input, select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            background: #fff;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        button {
            cursor: pointer;
            border: 0;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 600;
            color: #fff;
            background: var(--primary);
            transition: 0.2s ease;
        }

        button:hover { background: var(--primary-dark); }
        .btn-secondary { background: #5d6e86; }
        .btn-secondary:hover { background: #4c5b6f; }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }

        .status-msg {
            margin-top: 12px;
            color: var(--muted);
            min-height: 20px;
            font-size: 14px;
        }

        .chip-list {
            margin: 0;
            padding-left: 18px;
            color: #354255;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 10px;
            border: 1px solid var(--line);
        }

        th, td {
            border-bottom: 1px solid var(--line);
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #f5f8fd;
            font-weight: 700;
            color: #223049;
        }

        tr:last-child td { border-bottom: 0; }

        a {
            color: var(--primary);
            font-weight: 600;
        }

        .hint {
            background: #f6f9ff;
            border: 1px solid #dbe6fb;
            border-radius: 10px;
            padding: 12px;
            margin-top: 14px;
            font-size: 14px;
            color: #3a4a62;
        }

        .section-title {
            margin: 26px 0 14px;
            font-size: 30px;
        }

        .sports-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .sport-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .sport-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .sport-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(31, 60, 105, 0.18);
        }

        .sport-image {
            height: 160px;
            background-size: cover;
            background-position: center;
        }

        .sport-content {
            padding: 14px 16px 16px;
        }

        .sport-title {
            margin: 0 0 4px;
            font-size: 18px;
        }

        .sport-meta {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 13px;
        }

        .sport-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .badge {
            font-size: 12px;
            background: #eef4ff;
            color: #28406f;
            padding: 5px 9px;
            border-radius: 999px;
            font-weight: 700;
        }

        .badge-sport { background: #e8f5e9; color: #1b5e20; }
        .badge-price { background: #fff8e1; color: #e65100; }

        .card-cta {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
        }

        .resource-hero {
            width: 100%;
            height: 280px;
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        /* ── status pills ── */
        .status-pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }
        .status-pending  { background: #fff3cd; color: #856404; }
        .status-confirmed { background: #d1e7dd; color: #0f5132; }
        .status-rejected { background: #f8d7da; color: #842029; }
        .status-cancelled { background: #e2e3e5; color: #41464b; }

        /* ── employee stats bar ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 22px;
        }
        .stat-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px 24px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .stat-num {
            font-size: 42px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 6px;
        }
        .stat-label { font-size: 13px; color: var(--muted); font-weight: 600; }
        .stat-pending  .stat-num { color: #e07b00; }
        .stat-confirmed .stat-num { color: var(--success); }
        .stat-courts   .stat-num { color: var(--primary); }

        .emp-section { margin-bottom: 22px; }

        .row-actions { display: flex; gap: 6px; }
        .row-actions button {
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 8px;
        }

        /* ── calendar header ── */
        .cal-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 4px;
        }
        .cal-nav { display: flex; align-items: center; gap: 8px; }
        .cal-nav-btn { padding: 6px 14px; font-size: 14px; border-radius: 8px; }
        .cal-date-label { font-weight: 700; font-size: 15px; min-width: 240px; text-align: center; }
        .cal-today-btn {
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .cal-today-btn:hover { background: var(--primary-dark); }

        /* ── Gantt chart ── */
        .gantt-wrap { overflow-x: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
        .g-wrap { min-width: 720px; }

        /* header row */
        .g-header { display: flex; background: #f0f5fc; border-bottom: 2px solid var(--line); }
        .g-axis {
            flex: 1;
            position: relative;
            height: 32px;
        }
        .g-hour {
            position: absolute;
            top: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #7a8fa8;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        /* resource row */
        .g-row {
            display: flex;
            align-items: stretch;
            border-bottom: 1px solid var(--line);
            min-height: 62px;
        }
        .g-row:last-child { border-bottom: none; }
        .g-row:nth-child(even) .g-track { background: #f4f8ff; }
        .g-row:nth-child(odd)  .g-track { background: #f9fbff; }

        .g-label {
            width: 185px;
            flex-shrink: 0;
            padding: 10px 14px 10px 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fafcff;
            border-right: 1px solid var(--line);
        }
        .g-name { font-size: 13px; font-weight: 700; color: #1a2a40; line-height: 1.3; }
        .g-loc  { font-size: 11px; color: var(--muted); margin-top: 3px; }

        .g-track {
            flex: 1;
            position: relative;
        }

        /* vertical grid lines */
        .g-vlines { position: absolute; inset: 0; pointer-events: none; }
        .g-vline {
            position: absolute;
            top: 0; bottom: 0;
            width: 1px;
            background: rgba(180, 200, 230, 0.45);
        }

        /* now indicator */
        .g-now {
            position: absolute;
            top: 0; bottom: 0;
            width: 2px;
            background: #e53e3e;
            z-index: 10;
            pointer-events: none;
        }
        .g-now::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -4px;
            width: 10px; height: 10px;
            background: #e53e3e;
            border-radius: 50%;
        }

        /* booking blocks */
        .g-block {
            position: absolute;
            top: 6px;
            height: calc(100% - 12px);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 8px;
            overflow: hidden;
            min-width: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
            cursor: default;
            transition: filter 0.15s;
        }
        .g-block:hover { filter: brightness(1.08); }
        .g-block-text {
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            line-height: 1.3;
        }
        .g-block-time {
            font-size: 10px;
            font-weight: 500;
            color: rgba(255,255,255,0.85);
            white-space: nowrap;
            text-align: center;
        }
        .g-confirmed { background: linear-gradient(135deg, #1f9254, #27ae70); }
        .g-pending   { background: linear-gradient(135deg, #d97706, #f59e0b); }
        .g-cancelled { background: linear-gradient(135deg, #6b7280, #9ca3af); }

        .g-free-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #c5d0df;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        /* ── legend ── */
        .gantt-legend {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            font-size: 13px;
            color: var(--muted);
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-dot { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
        .dot-confirmed { background: linear-gradient(135deg, #1f9254, #27ae70); }
        .dot-pending   { background: linear-gradient(135deg, #d97706, #f59e0b); }
        .dot-free      { background: #f0f4fa; border: 1px solid var(--line); }

        /* ── reject modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 18px;
            padding: 28px;
            max-width: 420px;
            width: 92%;
            box-shadow: 0 24px 64px rgba(0,0,0,0.25);
        }

        @media (max-width: 900px) {
            .hero h1 { font-size: 36px; }
            .row { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
            .sports-grid { grid-template-columns: repeat(2, 1fr); }
            .stats-row { grid-template-columns: 1fr; }
            .gantt-resource-label { width: 110px; }
            .cal-date-label { min-width: 160px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="page">
    <header class="hero">
        <h1>Sportal MVP</h1>
        <p>Fast, clear sports reservations without overlaps.</p>
    </header>
    {% if request.user.is_authenticated %}
        <div class="topbar">
            Logged in as <strong style="margin: 0 6px;">{{ request.user.username }}</strong> |
            <form method="post" action="{% url 'logout' %}" style="display:inline; margin-left: 6px;">
                {% csrf_token %}
                <button type="submit" style="background:none;border:none;padding:0;color:inherit;cursor:pointer;font:inherit;text-decoration:underline;">Logout</button>
            </form>
        </div>
    {% endif %}
    {% if messages %}
        {% for message in messages %}
            <p class="status-msg">{{ message }}</p>
        {% endfor %}
    {% endif %}
    <main>
        {% block content %}{% endblock %}
    </main>
    </div>
    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(";").shift();
        }
    </script>
</body>
</html>
