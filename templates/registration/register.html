{% extends "base.html" %}
{% block content %}
<div class="card single-col" style="max-width: 520px;">
    <h2>Create client account</h2>
    <p class="subtitle">Your account lets you create and track requests.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create account</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
</div>
{% endblock %}
